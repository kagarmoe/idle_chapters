name: API CI

on:
  push:
    paths:
      - 'idle_chapters/**'
      - 'tests/**'
      - 'assets/**'
      - 'schemas/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'idle_chapters/**'
      - 'tests/**'
      - 'assets/**'
      - 'schemas/**'
      - 'requirements.txt'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
