id: 745e4625-4369-4431-bbbd-5f333d97bba8
name: ic-checks
description: >-
  Every quality gate on one ref, cheapest first; any failure stops the run.
  Runs on hippolyta's worker, in the behavior's dedicated clone (checkoutDir),
  never in anyone's working copy. Steps run one after another because they
  share one behavior lock.
tags: {}
# The serve on Hestia is remote-only: every step needs placement.
labels:
  host: hippolyta
inputs:
  properties:
    ref:
      type: string
      default: origin/main
      description: Commit or ref to check out in the dedicated clone
jobs:
  - name: checks
    description: Prepare the clone, then asset validation, Python tests, web type-check and build, web e2e
    steps:
      - name: prepare
        task:
          type: behavior
          behavior: idle-chapters-checks
          methodName: prepare
          inputs:
            ref: ${{ inputs.ref }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: validate-assets
        task:
          type: behavior
          behavior: idle-chapters-checks
          methodName: validateAssets
        dependsOn:
          - step: prepare
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: test
        task:
          type: behavior
          behavior: idle-chapters-checks
          methodName: test
        dependsOn:
          - step: validate-assets
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: build-web
        task:
          type: behavior
          behavior: idle-chapters-checks
          methodName: buildWeb
        dependsOn:
          - step: test
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: e2e-web
        task:
          type: behavior
          behavior: idle-chapters-checks
          methodName: e2eWeb
        dependsOn:
          - step: build-web
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
