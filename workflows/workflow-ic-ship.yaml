id: dc713ffd-ae59-4605-83e0-b90009363808
name: ic-ship
description: >-
  Verify one exact merged commit: run every check, then wait for Vercel's Git
  integration to put that commit live (one project serves web and API) and
  smoke-test production. PR CI is the gate before merge; this confirms the
  release.
inputs:
  properties:
    commit:
      type: string
      pattern: "^[0-9a-f]{40}$"
      description: Full SHA of the merged commit on main
  required: [commit]
tags: {}
# The serve on Hestia is remote-only: every step needs placement.
labels:
  host: hippolyta
jobs:
  - name: checks
    description: Every quality gate, on exactly this commit
    steps:
      - name: checks
        task:
          type: workflow
          workflowIdOrName: ic-checks
          inputs:
            ref: ${{ inputs.commit }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: deploy
    description: Wait for Vercel to deploy the commit, then smoke-test production
    dependsOn:
      - job: checks
        condition:
          type: succeeded
    steps:
      - name: smoke
        task:
          type: behavior
          behavior: idle-chapters-checks
          methodName: smoke
          inputs:
            commit: ${{ inputs.commit }}
        dependsOn: []
        weight: 0
        allowFailure: false
    weight: 0
  # Post the outcome to Discord; a Discord outage must not fail the release itself.
  - name: notify-shipped
    description: Tell Discord the commit is live and smoke-tested
    dependsOn:
      - job: deploy
        condition:
          type: succeeded
    steps:
      - name: post-shipped
        task:
          type: behavior
          behavior: ic-alerts
          methodName: send
          inputs:
            content: "✅ idle-chapters shipped ${{ inputs.commit }}: checks passed, live on production, smoke OK."
            username: idle-chapters ship
        dependsOn: []
        weight: 0
        allowFailure: true
    weight: 0
  - name: notify-failed
    description: Tell Discord the release did not complete (checks failed or deploy/smoke failed)
    dependsOn:
      - job: deploy
        condition:
          type: not
          condition:
            type: succeeded
    steps:
      - name: post-failed
        task:
          type: behavior
          behavior: ic-alerts
          methodName: send
          inputs:
            content: "❌ idle-chapters ship of ${{ inputs.commit }} did not complete. Details: swamp report get @swamp/workflow-summary --workflow ic-ship"
            username: idle-chapters ship
        dependsOn: []
        weight: 0
        allowFailure: true
    weight: 0
version: 1
