[project]
name = "idle-chapters"
version = "0.0.0"
description = "Idle Chapters"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Kimberly Garmoe"}]
# Runtime deps for the API (Vercel installs these); requirements.txt is the full dev lock.
dependencies = [
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "jsonschema==4.25.1",
    "mongomock==4.3.0",
    "pydantic==2.12.5",
    "pymongo==4.18.2",
    "uvicorn==0.40.0",
]

[tool.vercel]
entrypoint = "idle_chapters.api.server:server"
